<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ir a {{ vendedor }}</title></head><body><main><h1>{% if nonce %}Abriendo la página oficial de {{ vendedor }}…{% else %}Ir a la página oficial de {{ vendedor }}{% endif %}</h1>{% for aviso in avisos %}<p>{{ aviso }}</p>{% endfor %}<form id="envio" method="post" action="{{ url }}">{% for nombre, valor in campos %}<input type="hidden" name="{{ nombre }}" value="{{ valor }}">{% endfor %}<button type="submit">Ir a {{ vendedor }}</button></form></main>{% if nonce %}<script nonce="{{ nonce }}">document.getElementById("envio").submit();</script>{% endif %}</body></html>
