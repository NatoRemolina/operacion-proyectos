<!doctype html>
<!-- Como regresos.html, pero los resultados llegan 800 ms después del título (así lo sirvió Google el 13 nov).
     Página de ejemplo con la forma de la lista de regresos de Google Flights cuando la ida ya está elegida (texto y
     etiquetas accesibles tomados de la página real de Miami → Las Vegas el 13 de noviembre de 2026; marcado propio).
     Al elegir un regreso se muestra `reserva.html`. Sin red. -->
<html lang="en">
<head><meta charset="utf-8"><title>Las Vegas to Miami | Google Flights</title></head>
<body>
<main>
  <div>Search results</div><div>3 results returned.</div>
  <div>MIA–LAS</div>
  <h2>Choose return to Miami</h2><div>Returning flights</div>
  <div id="resultados"></div>
  <template id="lista">
  <ul>
    <li><div role="link" tabindex="0" onclick="location.href='/travel/flights/reserva'" aria-label="From 564 US dollars round trip total. Nonstop flight with American. Leaves Harry Reid International Airport at 11:06 PM on Friday, December 11 and arrives at Miami International Airport at 6:43 AM on Saturday, December 12. Total duration 4 hr 37 min.   1 carry-on bag included. 0 checked bags included.  Select flight">
      <div>11:06 PM</div><div>–</div><div>6:43 AM+1</div><div>American</div><div>4 hr 37 min</div><div>LAS–MIA</div><div>Nonstop</div>
      <div>$564</div><div>round trip</div>
    </div></li>
    <li><div role="link" tabindex="0" onclick="location.href='/travel/flights/reserva'" aria-label="From 619 US dollars round trip total. Nonstop flight with American. Leaves Harry Reid International Airport at 1:43 PM on Friday, December 11 and arrives at Miami International Airport at 9:29 PM on Friday, December 11. Total duration 4 hr 46 min.   1 carry-on bag included. 0 checked bags included.  Select flight">
      <div>1:43 PM</div><div>–</div><div>9:29 PM</div><div>American</div><div>4 hr 46 min</div><div>LAS–MIA</div><div>Nonstop</div>
      <div>$619</div><div>round trip</div>
    </div></li>
  </ul>
  </template>
  <script>setTimeout(function () {
    document.getElementById("resultados").appendChild(document.getElementById("lista").content.cloneNode(true));
  }, 800);</script>
</main>
</body>
</html>
