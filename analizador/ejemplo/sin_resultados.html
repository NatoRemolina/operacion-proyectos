<!doctype html>
<!-- La página de error de Google Flights (prueba 13, 13 nov 2026, tras varias cargas seguidas): la búsqueda sin
     resultados, «Oops, something went wrong.» y el botón «Reload». Texto del extracto real; marcado propio; sin red. -->
<html lang="en">
<head><meta charset="utf-8"><title>Google Flights</title></head>
<body><main>
  <div>Flight search</div><div>Round trip</div><div>Medellín MDE</div><div>Miami MIA</div>
  <h2>Search results</h2>
  <div>No results returned.</div>
  <div>Oops, something went wrong.</div>
  <button id="reload" onclick="document.body.dataset.recargas = (Number(document.body.dataset.recargas || 0) + 1)">Reload</button>
</main></body></html>
