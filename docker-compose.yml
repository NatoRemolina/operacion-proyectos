# Entorno local completo. No lee .env (que apunta a la nube): toda variable está escrita aquí,
# así que nada de lo que corre en este entorno puede escribir en la base real.
#
#   docker compose up -d db app                  base y plataforma actual (http://127.0.0.1:8000)
#   docker compose --profile web up -d           además la web nueva y el gateway (http://127.0.0.1:8088)
#   docker compose --profile analizador up -d    además el analizador de Google Flights (lectura de la página del vuelo)
#   make entorno-completo                        todo junto: base, plataforma, web, gateway y analizador
#   make tareas                                  una corrida del trabajador de capturas (en la nube corre cada 15 min)
#   docker compose down                          detener (los datos se conservan en los volúmenes)
#   docker compose down -v                       detener y borrar los datos de demostración
#
# Supabase sigue siendo la base real de la plataforma publicada. Este PostgreSQL es solo para
# desarrollar y probar con el mismo motor, sin tocarla.

name: operacion-proyectos

services:
  db:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065   # por digest, como las imágenes de la nube
    environment:
      POSTGRES_DB: operacion
      POSTGRES_USER: operacion
      POSTGRES_PASSWORD: operacion-local   # solo para este contenedor local; no es una credencial real
    ports: ["127.0.0.1:5433:5432"]
    volumes: [datos-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operacion -d operacion"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      ENTORNO: local                      # cookie «sesion» sin Secure, que funciona sobre http
      DATABASE_URL: postgresql://operacion:operacion-local@db:5432/operacion
      PREPARAR_BASE_LOCAL: "1"            # esta base es desechable: se migra y se siembra al arrancar
      CUENTAS_DEMO: "1"                   # crea las cuentas de demostración en esta base local
      ORIGENES_WEB: http://localhost:8088,http://127.0.0.1:8088
      # Servicios externos apagados: se trabaja con los datos guardados del repositorio. El buscador se enciende solo a
      # propósito, con `make entorno-completo ENV=<archivo>` (búsquedas pagas): toma SERPAPI_KEY de ese archivo y la
      # pasa como SERPAPI_KEY_LOCAL, un nombre que ningún .env define, así que no se lee del .env por descuido.
      SERPAPI_KEY: ${SERPAPI_KEY_LOCAL:-}
      MODELO_API_URL: ""
      MODELO_API_KEY: ""
      MODELO_NOMBRE: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      SECRETO_ARN: ""
      TELEGRAM_BOT_TOKEN: ""
      PINECONE_API_KEY: ""
      # Lectura de la página del vuelo en Google Flights: el servicio `analizador` (perfil «analizador»).
      # Sin él levantado, la lectura queda fallida con su motivo; ANALIZADOR: apagado la desactiva del todo.
      ANALIZADOR_URL: http://analizador:8090
      # Demostración del monitoreo del vuelo: fija el «ahora» (UTC) dentro de la ventana del vuelo IB 5634 del 13 de
      # diciembre de 2026 que prepara `make demo-monitoreo`. Solo se respeta con ENTORNO=local; sin ella, la hora real.
      # Para usarla, quitar el comentario y recrear el servicio: docker compose up -d app
      # MONITOREO_AHORA: "2026-12-13T06:00"
    ports: ["127.0.0.1:8000:8080"]
    volumes: [soportes:/srv/datos/archivos]   # los recibos cargados sobreviven a un reinicio
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/salud')\""]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    profiles: [web]
    build:
      context: ./web
      args:
        # Se incrusta al compilar: Proyectos, Usuarios y «Abrir la revisión completa» llevan a la plataforma actual
        NEXT_PUBLIC_PLATAFORMA_URL: http://127.0.0.1:8000
    depends_on:
      app: {condition: service_healthy}
    environment:
      NEXT_PUBLIC_API_BASE: /api/v1

  # Analizador de la página del vuelo (Playwright con su imagen oficial). Sin puerto publicado: solo lo alcanza la API.
  # Sus pruebas, sin red, con la etapa `pruebas` de su imagen (ver analizador/Dockerfile)
  analizador:
    profiles: [analizador]
    build:
      context: ./analizador
      target: produccion
    environment:
      ANALIZADOR: encendido               # «apagado»: no abre ninguna página
    shm_size: 1gb                         # Chromium usa memoria compartida para sus pestañas
    init: true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/salud')\""]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    profiles: [web]
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on: [app, web]
    ports: ["127.0.0.1:8088:80"]
    volumes: [./gateway/Caddyfile:/etc/caddy/Caddyfile:ro]

volumes:
  datos-pg:
  soportes:
