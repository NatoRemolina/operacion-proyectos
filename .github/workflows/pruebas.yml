name: Pruebas

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Revisión estática
        run: ruff check .
      - name: Pruebas
        # Sin claves: base SQLite temporal y servicios externos apagados (ver tests/conftest.py)
        run: pytest -q
